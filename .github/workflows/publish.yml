name: Build e Publicacao de imagem Docker

on:
  push:
    branches: [ "main" ] 

jobs:
  build-and-push:
  runs-on:  ubuntu-latest
  steps:
    - name: Baixar Codigo
      uses: action/checkout@v4

    - name: Configurar o Docker bluidx
      uses: docker/setup-bluidx-action@v3

    - name: Autenticar no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extrair Metadados do Docker 
      id: meta 
      uses: docker/metadata-action@v5 
      with:
        imagem: ${{ secrets.DOCKER_USERNAME }}/minha-aplicacao
        tags:
          type=raw,value=latest
          type=sha,format=short

    - name: Construir e Publicar imagem 
      uses: docker/build-push-action@v5 
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.output.labels }}